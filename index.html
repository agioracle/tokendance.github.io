<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="apple-touch-icon" href="apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="favicon-16x16.png">
    <link rel="icon" href="favicon.ico">
    <link rel="icon" type="image/png" sizes="192x192"  href="android-chrome-192x192.png">
    <link rel="icon" type="image/png" sizes="512x512"  href="android-chrome-512x512.png">
    <title>TokenDance</title>
    <meta name="description" content="TokenDance is a platform for creating and connecting in AGI times.">

    <!-- Social Graph -->
    <meta property="og:title" content="TokenDance">
    <meta property="og:description" content="TokenDance is a platform for creating and connecting in AGI times.">
    <meta property="og:image" content="https://tokendance.ai/android-chrome-512x512.png">
    <meta property="og:url" content="https://tokendance.ai">
    <meta property="og:type" content="website">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="TokenDance">
    <meta name="twitter:description" content="TokenDance is a platform for creating and connecting in AGI times.">
    <meta name="twitter:image" content="https://tokendance.ai/android-chrome-512x512.png">

    <meta name="keywords" content="AI, AGI, TokenDance, Create, Connect">
    <meta name="author" content="agioracle">
    <meta name="robots" content="index, follow">
    <meta name="googlebot" content="index, follow">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700;800&family=Noto+Sans+SC:wght@300;400;500&family=Noto+Sans+JP:wght@300;400&family=Noto+Sans+KR:wght@300;400&display=swap" rel="stylesheet">
    <style>
        /*
         * TokenDance — Refined Tech Minimalism
         * 4-color high-saturation palette:
         *   Vivid Blue    #0D52D6
         *   Electric Blue  #1B8AE8
         *   Bright Teal    #00AACC
         *   Vivid Cyan     #00C4A0
         */

        :root {
            --c1: #0D52D6;
            --c2: #1B8AE8;
            --c3: #00AACC;
            --c4: #00C4A0;
            --bg: #FAFBFD;
            --text-muted: rgba(13, 82, 214, 0.35);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            overflow-x: hidden;
        }

        body {
            font-family: 'Outfit', 'Noto Sans SC', sans-serif;
            background: var(--bg);
            min-height: 100vh;
            /* Subtle dot grid texture */
            background-image:
                radial-gradient(circle, rgba(13, 82, 214, 0.035) 1px, transparent 1px);
            background-size: 32px 32px;
        }

        /* ── Ambient Glow Orbs ── */
        .ambient-glow {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            pointer-events: none;
            overflow: hidden;
        }

        .glow-orb {
            position: absolute;
            border-radius: 50%;
            filter: blur(100px);
            opacity: 0;
            animation: orbFloat 18s ease-in-out infinite;
        }

        .glow-orb:nth-child(1) {
            width: 500px;
            height: 500px;
            background: var(--c1);
            top: -10%;
            left: -5%;
            opacity: 0.04;
            animation-delay: 0s;
            animation-duration: 22s;
        }

        .glow-orb:nth-child(2) {
            width: 400px;
            height: 400px;
            background: var(--c3);
            bottom: -8%;
            right: -3%;
            opacity: 0.035;
            animation-delay: -6s;
            animation-duration: 18s;
        }

        .glow-orb:nth-child(3) {
            width: 350px;
            height: 350px;
            background: var(--c4);
            top: 40%;
            right: 20%;
            opacity: 0.025;
            animation-delay: -12s;
            animation-duration: 25s;
        }

        @keyframes orbFloat {
            0%, 100% {
                transform: translate(0, 0) scale(1);
                opacity: 0.03;
            }
            33% {
                transform: translate(40px, -30px) scale(1.1);
                opacity: 0.055;
            }
            66% {
                transform: translate(-20px, 20px) scale(0.95);
                opacity: 0.035;
            }
        }

        /* ── Token Rain Background ── */
        .token-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            overflow: hidden;
        }

        .token-column {
            position: absolute;
            top: -120px;
            font-size: 15px;
            line-height: 1.6;
            white-space: pre;
            animation: tokenFall linear infinite;
            font-family: 'Noto Sans SC', 'Noto Sans JP', 'Noto Sans KR', 'Outfit', sans-serif;
            font-weight: 300;
            letter-spacing: 0.04em;
            pointer-events: none;
            will-change: transform;
        }

        /* Depth layers for token rain */
        .token-column.depth-far {
            filter: blur(0.5px);
            opacity: 0.18 !important;
            font-size: 12px !important;
        }

        .token-column.depth-mid {
            filter: blur(0px);
            opacity: 0.28 !important;
        }

        .token-column.depth-near {
            filter: blur(0px);
            opacity: 0.4 !important;
            font-size: 16px !important;
        }

        @keyframes tokenFall {
            0% {
                transform: translateY(-100vh);
                opacity: 0;
            }
            4% {
                opacity: 1;
            }
            92% {
                opacity: 1;
            }
            100% {
                transform: translateY(105vh);
                opacity: 0;
            }
        }

        .overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background:
                radial-gradient(ellipse at 50% 50%, transparent 50%, rgba(250, 251, 253, 0.6) 90%);
            z-index: 5;
            pointer-events: none;
        }

        /* ── Main Content ── */
        .content {
            position: relative;
            z-index: 10;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            width: 100%;
            padding: 20px;
            text-align: center;
        }

        /* ── Logo Title ── */
        .logo {
            font-family: 'Outfit', sans-serif;
            font-size: clamp(3.2rem, 10vw, 6rem);
            font-weight: 800;
            letter-spacing: -0.03em;
            margin-bottom: 0;
            cursor: pointer;
            width: 100%;
            max-width: 900px;
            text-align: center;
            line-height: 1.05;
            position: relative;
        }

        .char {
            display: inline-block;
            color: var(--c1);
            transition: color 0.8s cubic-bezier(0.25, 0.46, 0.45, 0.94),
                        transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1),
                        text-shadow 0.3s ease;
            opacity: 0;
            transform: translateY(30px) scale(0.9);
            animation: charReveal 0.7s cubic-bezier(0.16, 1, 0.3, 1) forwards;
            /* 3D layered shadow effect */
            text-shadow:
                0 1px 0 rgba(0, 0, 0, 0.12),
                0 2px 0 rgba(0, 0, 0, 0.10),
                0 3px 0 rgba(0, 0, 0, 0.08),
                0 4px 0 rgba(0, 0, 0, 0.06),
                0 5px 0 rgba(0, 0, 0, 0.04),
                0 6px 8px rgba(0, 0, 0, 0.08);
        }

        .char.revealed {
            opacity: 1;
            transform: translateY(0) scale(1);
            filter: blur(0px);
            animation: none;
        }

        .char:nth-child(1)  { animation-delay: 0.08s; }
        .char:nth-child(2)  { animation-delay: 0.15s; }
        .char:nth-child(3)  { animation-delay: 0.22s; }
        .char:nth-child(4)  { animation-delay: 0.29s; }
        .char:nth-child(5)  { animation-delay: 0.36s; }
        .char:nth-child(6)  { animation-delay: 0.46s; }
        .char:nth-child(7)  { animation-delay: 0.53s; }
        .char:nth-child(8)  { animation-delay: 0.60s; }
        .char:nth-child(9)  { animation-delay: 0.67s; }
        .char:nth-child(10) { animation-delay: 0.74s; }

        @keyframes charReveal {
            0% {
                opacity: 0;
                transform: translateY(30px) scale(0.9);
                filter: blur(6px);
            }
            100% {
                opacity: 1;
                transform: translateY(0) scale(1);
                filter: blur(0px);
            }
        }

        .char:hover {
            transform: translateY(-4px) scale(1.05);
            text-shadow:
                0 2px 0 rgba(0, 0, 0, 0.12),
                0 4px 0 rgba(0, 0, 0, 0.10),
                0 6px 0 rgba(0, 0, 0, 0.08),
                0 8px 0 rgba(0, 0, 0, 0.06),
                0 10px 0 rgba(0, 0, 0, 0.04),
                0 12px 16px rgba(0, 0, 0, 0.10);
        }

        .char.wave {
            animation: charWave 0.7s cubic-bezier(0.34, 1.56, 0.64, 1);
            filter: drop-shadow(0 0 18px currentColor) drop-shadow(0 0 4px currentColor);
            opacity: 1 !important;
        }

        @keyframes charWave {
            0%   {
                transform: translateY(0) scale(1);
                text-shadow:
                    0 1px 0 rgba(0, 0, 0, 0.12),
                    0 2px 0 rgba(0, 0, 0, 0.10),
                    0 3px 0 rgba(0, 0, 0, 0.08),
                    0 4px 0 rgba(0, 0, 0, 0.06),
                    0 5px 0 rgba(0, 0, 0, 0.04),
                    0 6px 8px rgba(0, 0, 0, 0.08);
            }
            40%  {
                transform: translateY(-28px) scale(1.12) rotate(-2deg);
                text-shadow:
                    0 4px 0 rgba(0, 0, 0, 0.10),
                    0 8px 0 rgba(0, 0, 0, 0.08),
                    0 12px 0 rgba(0, 0, 0, 0.06),
                    0 16px 0 rgba(0, 0, 0, 0.04),
                    0 20px 0 rgba(0, 0, 0, 0.02),
                    0 28px 24px rgba(0, 0, 0, 0.12);
            }
            100% {
                transform: translateY(0) scale(1) rotate(0deg);
                text-shadow:
                    0 1px 0 rgba(0, 0, 0, 0.12),
                    0 2px 0 rgba(0, 0, 0, 0.10),
                    0 3px 0 rgba(0, 0, 0, 0.08),
                    0 4px 0 rgba(0, 0, 0, 0.06),
                    0 5px 0 rgba(0, 0, 0, 0.04),
                    0 6px 8px rgba(0, 0, 0, 0.08);
            }
        }

        /* ── Separator: language token showcase ── */
        .separator-wrapper {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 20px;
            margin: 2.2rem 0 1rem;
            opacity: 0;
            animation: fadeInUp 0.8s ease forwards;
            animation-delay: 1.5s;
        }

        .separator-line {
            width: 40px;
            height: 1px;
            background: linear-gradient(90deg, transparent, var(--c2), transparent);
            opacity: 0.4;
        }

        .separator {
            font-size: clamp(0.85rem, 2vw, 1rem);
            font-weight: 400;
            letter-spacing: 3px;
            position: relative;
            height: 28px;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        .separator-text {
            transition: opacity 0.5s cubic-bezier(0.25, 0.46, 0.45, 0.94),
                        transform 0.5s cubic-bezier(0.25, 0.46, 0.45, 0.94);
            white-space: nowrap;
            font-family: 'Noto Sans SC', 'Noto Sans JP', 'Noto Sans KR', 'Outfit', sans-serif;
        }

        .separator-text.color-0 { color: var(--c1); }
        .separator-text.color-1 { color: var(--c2); }
        .separator-text.color-2 { color: var(--c3); }
        .separator-text.color-3 { color: var(--c4); }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(12px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* ── Tagline (hidden but preserved) ── */
        .tagline {
            font-size: clamp(1.2rem, 3vw, 1.5rem);
            font-weight: 600;
            letter-spacing: 0.18em;
            text-transform: uppercase;
            background: linear-gradient(90deg, var(--c2), var(--c3), var(--c4));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            max-width: 800px;
            margin: 0 auto;
            text-align: center;
            width: 100%;
        }

        /* ── Footer ── */
        .footer {
            position: relative;
            z-index: 10;
            bottom: 0;
            width: 100%;
            padding: 32px 24px;
            text-align: center;
            color: var(--text-muted);
            font-size: clamp(0.72rem, 1.8vw, 0.82rem);
            font-weight: 300;
            letter-spacing: 0.04em;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
            opacity: 0;
            animation: fadeInUp 0.8s ease forwards;
            animation-delay: 1.9s;
        }

        .footer-link {
            color: var(--c2);
            opacity: 0.5;
            text-decoration: none;
            transition: opacity 0.3s, color 0.3s;
            position: relative;
        }

        .footer-link::after {
            content: '';
            position: absolute;
            bottom: -1px;
            left: 0;
            width: 0;
            height: 1px;
            background: var(--c1);
            transition: width 0.3s ease;
        }

        .footer-link:hover {
            color: var(--c1);
            opacity: 1;
        }

        .footer-link:hover::after {
            width: 100%;
        }

        /* ── Mouse Trail ── */
        .cursor-trail {
            position: fixed;
            pointer-events: none;
            z-index: 15;
            font-family: 'Noto Sans SC', 'Outfit', sans-serif;
            font-size: 14px;
            font-weight: 400;
            user-select: none;
        }

        /* ── Responsive ── */
        @media (max-width: 768px) {
            .logo {
                font-size: clamp(2.8rem, 10vw, 4.5rem);
            }

            .separator-line {
                width: 24px;
            }
        }

        @media (max-width: 480px) {
            .logo {
                font-size: 2.6rem;
            }

            .tagline {
                font-size: 1rem;
                letter-spacing: 0.12em;
            }

            .separator-line {
                width: 16px;
            }
        }

        /* ── Custom Scrollbar ── */
        ::-webkit-scrollbar { width: 3px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: rgba(13, 82, 214, 0.15); border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: rgba(13, 82, 214, 0.3); }

        ::selection {
            background: rgba(13, 82, 214, 0.12);
            color: var(--c1);
        }

        /* ── Smooth scrolling ── */
        html {
            scroll-behavior: smooth;
        }
    </style>
</head>
<body>
    <!-- Ambient floating glow orbs -->
    <div class="ambient-glow">
        <div class="glow-orb"></div>
        <div class="glow-orb"></div>
        <div class="glow-orb"></div>
    </div>

    <div class="token-bg" id="tokenBg"></div>
    <div class="overlay"></div>

    <div class="content">
        <h1 class="logo" id="logo">
            <span class="char">T</span><span class="char">o</span><span class="char">k</span><span class="char">e</span><span class="char">n</span><span class="char">D</span><span class="char">a</span><span class="char">n</span><span class="char">c</span><span class="char">e</span>
        </h1>
        <div class="separator-wrapper">
            <div class="separator-line"></div>
            <div class="separator">
                <span class="separator-text color-0" id="separatorText"></span>
            </div>
            <div class="separator-line"></div>
        </div>
        <!-- <p class="tagline">Create & Connect</p> -->
    </div>

    <footer class="footer">
        <p>&copy; 2025 <a class="footer-link" href="https://tokendance.ai" target="_blank">TokenDance</a>. All rights reserved.</p>
    </footer>

    <script>
        // ═══════════════════════════════════════
        // Palette — 4 colors only
        // ═══════════════════════════════════════
        const COLORS = ['#0D52D6', '#1B8AE8', '#00AACC', '#00C4A0'];

        // ═══════════════════════════════════════
        // Token characters: 创造 · 连接 · 进化
        // Translated into 11 languages
        // ═══════════════════════════════════════
        const TOKEN_CHARS = {
            zh: ['创', '造', '连', '接', '进', '化'],
            en: ['create', 'make', 'connect', 'join', 'advance', 'evolve'],
            ja: ['創', '造', '連', '接', '進', '化'],
            ko: ['창', '조', '연', '접', '진', '화'],
            fr: ['créer', 'faire', 'lier', 'joindre', 'avancer', 'évoluer'],
            es: ['crear', 'hacer', 'unir', 'juntar', 'avanzar', 'evolucionar'],
            de: ['schaffen', 'machen', 'binden', 'fügen', 'schreiten', 'wandeln'],
            ru: ['создать', 'делать', 'связать', 'принять', 'идти', 'эволюция'],
            ar: ['إبداع', 'صنع', 'ربط', 'وصل', 'تقدم', 'تطور'],
            hi: ['सृजन', 'बनाना', 'जोड़', 'जुड़', 'आगे', 'विकास'],
            pt: ['criar', 'fazer', 'ligar', 'juntar', 'avançar', 'evoluir'],
        };

        const LANG_KEYS = Object.keys(TOKEN_CHARS);

        function randomLang() {
            return LANG_KEYS[Math.floor(Math.random() * LANG_KEYS.length)];
        }

        function randomCharFromLang(lang) {
            const chars = TOKEN_CHARS[lang];
            return chars[Math.floor(Math.random() * chars.length)];
        }

        function randomColor() {
            return COLORS[Math.floor(Math.random() * COLORS.length)];
        }

        // ═══════════════════════════════════════
        // Token Rain with depth layers
        // ═══════════════════════════════════════
        const tokenBg = document.getElementById('tokenBg');
        const DEPTH_CLASSES = ['depth-far', 'depth-mid', 'depth-near'];
        const DEPTH_WEIGHTS = [0.4, 0.35, 0.25]; // More far, fewer near

        function pickDepth() {
            const r = Math.random();
            if (r < DEPTH_WEIGHTS[0]) return DEPTH_CLASSES[0];
            if (r < DEPTH_WEIGHTS[0] + DEPTH_WEIGHTS[1]) return DEPTH_CLASSES[1];
            return DEPTH_CLASSES[2];
        }

        function createTokenColumn() {
            const column = document.createElement('div');
            const depth = pickDepth();
            column.className = 'token-column ' + depth;

            const color = randomColor();
            const lang = randomLang();

            const length = Math.floor(Math.random() * 10) + 5;
            let text = '';
            for (let i = 0; i < length; i++) {
                text += randomCharFromLang(lang) + '\n';
            }

            column.textContent = text;
            column.style.left = Math.random() * window.innerWidth + 'px';
            column.style.color = color;

            // Speed varies by depth — far = slower, near = faster
            const baseSpeed = depth === 'depth-far' ? 16 : depth === 'depth-mid' ? 12 : 9;
            const speed = (Math.random() * 6 + baseSpeed);
            column.style.animationDuration = speed + 's';

            const baseFontSize = depth === 'depth-far' ? 11 : depth === 'depth-mid' ? 14 : 16;
            column.style.fontSize = (Math.random() * 2 + baseFontSize) + 'px';

            tokenBg.appendChild(column);

            const duration = speed * 1000 + 500;
            setTimeout(() => {
                if (column.parentNode) column.parentNode.removeChild(column);
            }, duration);
        }

        // Staggered initial burst
        const initColumns = Math.floor(window.innerWidth / 30);
        for (let i = 0; i < initColumns; i++) {
            setTimeout(() => createTokenColumn(), Math.random() * 4000);
        }

        // Continuous creation
        setInterval(createTokenColumn, 600);

        // Handle resize
        let resizeTimeout;
        window.addEventListener('resize', () => {
            clearTimeout(resizeTimeout);
            resizeTimeout = setTimeout(() => {
                const existing = document.querySelectorAll('.token-column');
                existing.forEach(col => col.remove());
                const newCols = Math.floor(window.innerWidth / 30);
                for (let i = 0; i < newCols; i++) {
                    setTimeout(() => createTokenColumn(), Math.random() * 2000);
                }
            }, 200);
        });

        // ═══════════════════════════════════════
        // Separator: rotating language tokens
        // ═══════════════════════════════════════
        const separatorPhrases = [
            { text: 'create · connect · evolve', lang: 'en' },
            { text: '创造 · 连接 · 进化', lang: 'zh' },
            { text: '創造 · 接続 · 進化', lang: 'ja' },
            { text: '창조 · 연결 · 진화', lang: 'ko' },
            { text: 'créer · connecter · évoluer', lang: 'fr' },
            { text: 'crear · conectar · evolucionar', lang: 'es' },
            { text: 'schaffen · verbinden · entwickeln', lang: 'de' },
            { text: 'создать · связать · эволюция', lang: 'ru' },
            { text: 'إبداع · اتصال · تطور', lang: 'ar' },
            { text: 'सृजन · जोड़ना · विकास', lang: 'hi' },
            { text: 'criar · conectar · evoluir', lang: 'pt' },
        ];

        const separatorEl = document.getElementById('separatorText');
        let sepIdx = 0;
        let colorIdx = 0;

        function cycleSeparator() {
            separatorEl.style.opacity = '0';
            separatorEl.style.transform = 'translateY(8px) scale(0.98)';

            setTimeout(() => {
                sepIdx = (sepIdx + 1) % separatorPhrases.length;
                colorIdx = (colorIdx + 1) % 4;
                separatorEl.textContent = separatorPhrases[sepIdx].text;
                separatorEl.className = 'separator-text color-' + colorIdx;
                separatorEl.style.opacity = '1';
                separatorEl.style.transform = 'translateY(0) scale(1)';
            }, 500);
        }

        // Initialize first phrase
        separatorEl.textContent = separatorPhrases[0].text;
        separatorEl.className = 'separator-text color-0';
        separatorEl.style.opacity = '1';
        setInterval(cycleSeparator, 3000);

        // ═══════════════════════════════════════
        // Logo character wave effect
        // ═══════════════════════════════════════
        const logo = document.getElementById('logo');
        const chars = logo.querySelectorAll('.char');
        let waveInterval;
        let isHovering = false;

        function startWave() {
            if (waveInterval) return;
            let idx = 0;
            waveInterval = setInterval(() => {
                chars.forEach(c => c.classList.remove('wave'));
                if (chars[idx]) chars[idx].classList.add('wave');
                idx++;
                if (idx >= chars.length) {
                    clearInterval(waveInterval);
                    waveInterval = null;
                    if (isHovering) setTimeout(startWave, 400);
                }
            }, 80);
        }

        logo.addEventListener('mouseenter', () => {
            isHovering = true;
            startWave();
        });

        logo.addEventListener('mouseleave', () => {
            isHovering = false;
            if (waveInterval) {
                clearInterval(waveInterval);
                waveInterval = null;
            }
            chars.forEach(c => c.classList.remove('wave'));
        });

        // ═══════════════════════════════════════
        // Logo characters: random color cycling
        // ═══════════════════════════════════════
        function randomizeCharColors() {
            chars.forEach(c => {
                c.style.color = randomColor();
            });
        }

        // Initial random colors after reveal animation completes for all chars
        // Last char: delay 0.74s + animation 0.7s = 1.44s, wait until 1.6s
        setTimeout(() => {
            // Mark all chars as revealed so wave animation won't reset opacity
            chars.forEach(c => c.classList.add('revealed'));
            randomizeCharColors();
        }, 1600);

        // Smooth color cycling — one char at a time
        setInterval(() => {
            const idx = Math.floor(Math.random() * chars.length);
            chars[idx].style.color = randomColor();
        }, 900);

        // ═══════════════════════════════════════
        // Mouse trail — floating token words
        // ═══════════════════════════════════════
        let lastTrailTime = 0;

        document.addEventListener('mousemove', (e) => {
            const now = Date.now();
            if (now - lastTrailTime < 70) return;
            lastTrailTime = now;

            const word = randomCharFromLang(randomLang());
            const trail = document.createElement('div');
            trail.className = 'cursor-trail';
            trail.textContent = word;

            // Slight random offset from cursor
            const offsetX = (Math.random() - 0.5) * 16;
            const offsetY = (Math.random() - 0.5) * 8;
            trail.style.left = (e.clientX + offsetX) + 'px';
            trail.style.top = (e.clientY + offsetY) + 'px';
            trail.style.color = randomColor();
            trail.style.opacity = '0.55';

            const rotation = (Math.random() - 0.5) * 30;
            const scale = 0.8 + Math.random() * 0.5;
            trail.style.transform = `rotate(${rotation}deg) scale(${scale})`;

            document.body.appendChild(trail);

            requestAnimationFrame(() => {
                trail.style.transition = 'all 1.4s cubic-bezier(0.25, 0.46, 0.45, 0.94)';
                trail.style.opacity = '0';
                const driftX = (Math.random() - 0.5) * 30;
                trail.style.transform = `translateY(-35px) translateX(${driftX}px) rotate(${rotation + 15}deg) scale(0.5)`;
            });

            setTimeout(() => {
                if (trail.parentNode) trail.parentNode.removeChild(trail);
            }, 1500);
        });
    </script>
</body>
